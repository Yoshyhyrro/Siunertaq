# k8s/secret.example.yaml
#
# Template only -- do not commit real credentials. Copy this, fill in
# real values, and apply the copy (or generate it with
# `kubectl create secret generic ... --from-literal=...` instead of
# checking a filled-in copy into git at all).
#
# Keys match exactly what ClickHouseConfig.fromEnv (ClickHouseSync.scala)
# and the Postgres connection config (ForthConnMachine.scala) read --
# CLICKHOUSE_PASS / POSTGRES_PASS are the only two that are actually
# secret; host/port/db/user are non-secret and set directly as plain env
# vars on the Job/CronJob (see job-batch-bridge.yaml /
# cronjob-postgres-bridge.yaml), not via this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: siunertaq-db-credentials
  namespace: siunertaq
type: Opaque
stringData:
  CLICKHOUSE_PASS: "REPLACE_ME"
  POSTGRES_PASS: "REPLACE_ME"