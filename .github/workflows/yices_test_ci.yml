name: Yices Threshold CI

on:
  workflow_dispatch:
  push:
    branches:
      - example/feature/clojure_Alexander–Hodge
    paths:
      - build.sbt
      - modules/core/**
      - modules/z3-bridge/**
      - modules/dhall-bridge/**          # Captures CondEvaluatorSpec changes
      - modules/batch-bridge/**          # Captures PerlBridge and RubyBridge source changes
      - modules/yices-bridge/**
      - examples/**                      # Example updates may affect downstream tests
      - modules/postgres-bridge/**       # Postgres bridge updates may affect test suite execution
      - .github/workflows/yices_test_ci.yml
  pull_request:
    paths:
      - build.sbt
      - modules/core/**
      - modules/z3-bridge/**
      - modules/dhall-bridge/**
      - modules/batch-bridge/**          # Captures PerlBridge and RubyBridge source changes
      - modules/yices-bridge/**
      - examples/**                      # Example updates may affect downstream tests
      - modules/postgres-bridge/**       # Postgres bridge updates may affect test suite execution
      - .github/workflows/yices_test_ci.yml

permissions:
  contents: read
concurrency:
  group: yices-threshold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yices-threshold-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_YICES_SMOKE: "1"
      YICES_ARTIFACT_DIR: modules/yices-bridge/target/yices-artifacts
      RUN_PERL_CROSSCHECK: "1"                       # Enable PerlBridgeSpec and .pl script generation
      PERL_SCRIPT_SAVE_DIR: ci-out/perl-scripts      # Persist generated .pl scripts as build artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install Yices 2
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:sri-csl/formal-methods
          sudo apt-get update
          sudo apt-get install -y yices2

      - name: Show Yices version
        shell: bash
        run: |
          set -euxo pipefail
          yices-smt2 --version

      # CondEvaluator is a pure Scala class, so its unit tests can be run without Yices installed.  This is useful for testing the CI setup itself.
      - name: Run CondEvaluator unit tests (pure; no Yices required)
        shell: bash
        run: |
          set -euxo pipefail
          sbt "batchBridge/testOnly io.siunertaq.batch.CondEvaluatorSpec"

      - name: Run threshold and Yices tests
        shell: bash
        run: |
          set -euxo pipefail
          sbt \
            "core/testOnly io.siunertaq.threshold.* io.siunertaq.expr.NamespaceCanonHashedSpec" \
            "z3Bridge/compile"                                  \
            "yicesBridge/compile"                               \
            "batchBridge/compile"                               \
            "batchBridge/testOnly io.siunertaq.batch.PerlBridgeSpec" \
            "postgresBridge/compile"                            \
            "petersenMzv/compile"                              \
            "yicesBridge/testOnly io.siunertaq.yicesbridge.*"

      # --- Common Library Artifacts -----------------------------------------
      # Package compiled classes into JARs. Incremental builds minimize overhead.
      # Target modules: core (Program / Instr / Value IR definitions)
      #                batch-bridge (PerlBridge / StackMachineTasklet / ScriptBackend)
      #                postgres-bridge (ClickHouse schema + CDC pipeline)
      - name: Package common library JARs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          sbt \
            "core/package"             \
            "batchBridge/package"      \
            "postgresBridge/package"

      - name: Collect common library artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-out/schema ci-out/perl-scripts   # Ensure perl-scripts directory exists prior to search

          # --- JAR: Store in module-specific subdirectories to prevent overwrite collisions ---
          for mod in core batch-bridge postgres-bridge; do
            src="modules/$mod/target"
            dest="ci-out/jars/$mod"
            mkdir -p "$dest"
            find "$src" -maxdepth 3 -name "*.jar" \
              ! -name "*-sources.jar"              \
              ! -name "*-javadoc.jar"              \
              -print0 | xargs -0 -I{} cp {} "$dest/"
          done

          # --- .class: Collect while preserving package hierarchy ---
          # Traverse subdirectories under target/scala-3.x.x/classes/ without maxdepth restriction
          # Extract relative path starting from classes/ and copy to destination
          for mod in core batch-bridge; do
            find "modules/$mod/target" -name "*.class" -path "*/classes/io/*" \
              -print0 | while IFS= read -r -d '' f; do
                rel="${f##*/classes/}"
                dest="ci-out/classes/$mod/$rel"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done
          done

          # --- .pl: Scripts persisted in PERL_SCRIPT_SAVE_DIR ---
          # Emitted by PerlBridge.executePerl when RUN_PERL_CROSSCHECK=1 is set
          pl_dir="${PERL_SCRIPT_SAVE_DIR:-ci-out/perl-scripts}"
          pl_count=$(find "$pl_dir" -name "*.pl" 2>/dev/null | wc -l)
          echo ".pl scripts collected: $pl_count"

          # --- .pm: Perl modules located in batch-bridge resources (if present) ---
          pm_src="modules/batch-bridge/src/main/resources"
          if find "$pm_src" \( -name "*.pm" -o -name "*.pl" \) -quit 2>/dev/null \
             | grep -q .; then
            find "$pm_src" \( -name "*.pm" -o -name "*.pl" \) \
              -print0 | while IFS= read -r -d '' f; do
                rel="${f#$pm_src/}"          # e.g., perl/Siunertaq/StackMachine.pm
                dest="ci-out/perl/$rel"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done
          fi

          # --- ClickHouse schema SQL --------------------------------------------
          find . -path "*/resources/clickhouse_schema.sql" \
            -print0 | xargs -0 -I{} cp {} ci-out/schema/

          echo "=== ci-out layout ==="
          find ci-out -type f | sort

      - name: Upload common library
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: siunertaq-common-library-${{ github.sha }}
          path: ci-out/
          if-no-files-found: warn

      - name: Upload Yices artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yices-threshold-artifacts
          path: modules/yices-bridge/target/yices-artifacts
          if-no-files-found: ignore