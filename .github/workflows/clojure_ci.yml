name: Clojure CI

on:
  push:
    branches:
      - "example/feature/clojure_Alexander–Hodge"
    paths:
      - modules/dhall-bridge/**
      - modules/postgres-bridge/**
      - .github/workflows/clojure_ci.yml
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip running Clojure unit tests"
        required: false
        type: boolean
        default: false

jobs:
  run-clojure-dhall-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Official Setup Clojure Action
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@5.0
        with:
          cli: 'latest'

      # Install dhall-to-json binary for Clojure runner
      - name: Install Dhall CLI
        run: |
          curl -sSL https://github.com/dhall-lang/dhall-haskell/releases/download/1.41.2/dhall-json-1.7.11-x86_64-Linux.tar.bz2 | tar -xj
          sudo mv bin/dhall-to-json /usr/local/bin/
          dhall-to-json --version

      # Run Unit Tests (Alexander-Hodge traversal, AVX2 SIMD mocks, and
      # flock-size diagnostics). The :test alias only has :exec-fn (no
      # :main-opts) -- there is no siunertaq/test_runner.clj to -m into
      # -- so this must be invoked with -X, not -M. See deps.edn's
      # :test alias comment.
      - name: Run Clojure unit tests
        if: ${{ inputs.skip_tests != true }}
        working-directory: modules/dhall-bridge
        run: clojure -X:test

      # Execute Batch Runner Application
      - name: Run Clojure batch runner
        working-directory: modules/dhall-bridge
        run: clojure -M:run

  run-clojure-postgres-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@5.0
        with:
          cli: 'latest'

      # sbt setup + module compile: compilation_wiring_test.clj does real
      # JVM interop into io.siunertaq.postgres.MecrispCompiler (not a
      # transcribed model, unlike mecrisp_instr_test.clj), which needs
      # this module's actual compiled classes -- and everything they
      # depend on (Scala standard library, ASM, cats-effect, etc.) -- on
      # the classpath.
      #
      # Earlier version #1 guessed the path (target/scala-3/classes) --
      # wrong (ClassNotFoundException). Version #2 switched to
      # `sbt export ...fullClasspath`, but sbt's supershell writes ANSI
      # status-line escape codes straight to stdout regardless of
      # --error's log-level setting, so the piped output captured a
      # terminal control sequence instead of the classpath (confirmed:
      # the captured file was 4 bytes, "\x1b[0J" -- ClassNotFoundException
      # again, same symptom, different cause). -Dsbt.supershell=false
      # turns that off at the source; the sed strips any escape codes
      # that still make it through as a second line of defense; the
      # final check fails the step immediately with a clear message
      # instead of leaving another cryptic ClassNotFoundException for
      # the Clojure step to surface two steps later.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile postgres-bridge and export its classpath (Scala)
        run: |
          sbt postgresBridge/compile
          sbt -Dsbt.supershell=false --error \
            'export postgresBridge/Compile/fullClasspath' \
            | tail -n 1 \
            | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' \
            > /tmp/postgres-bridge.classpath
          echo "Exported classpath length: $(wc -c < /tmp/postgres-bridge.classpath) bytes"
          echo "First 300 chars:"
          head -c 300 /tmp/postgres-bridge.classpath
          echo
          if [ ! -s /tmp/postgres-bridge.classpath ] || \
             ! grep -q "postgres-bridge" /tmp/postgres-bridge.classpath; then
            echo "::error::Exported classpath is empty or missing postgres-bridge's own classes -- see the raw output above. sbt's export command or supershell setting may need another look."
            exit 1
          fi

      # No Dhall CLI and no -main here: this module is currently
      # test-only. It has no :run alias and defines no entry point to
      # execute. -Scp prepends the sbt-exported classpath above onto
      # whatever :test alone would compute (test.check, test-runner,
      # this module's own test/main/clojure sources) -- so this module's
      # compiled Scala classes are visible to compilation_wiring_test.clj
      # without needing deps.edn to know or guess where sbt put them.
      - name: Run Clojure unit tests
        if: ${{ inputs.skip_tests != true }}
        working-directory: modules/postgres-bridge
        run: |
          BASE_CP=$(clojure -Spath -A:test)
          clojure -Scp "$(cat /tmp/postgres-bridge.classpath):${BASE_CP}" -X:test

      # Upload Clojure crash dumps and runtime classpath on test failure
      - name: Upload Clojure test crash report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-test-failure-report
          path: |
            /tmp/clojure-*.edn
            /tmp/postgres-bridge.classpath