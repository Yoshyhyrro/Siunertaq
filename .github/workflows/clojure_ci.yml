name: Clojure CI

on:
  push:
    branches:
      - "hotfix/example/rows-wordBuf_clojure-test"
    paths:
      - modules/dhall-bridge/**
      - modules/postgres-bridge/**
      - .github/workflows/clojure_ci.yml
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip running Clojure unit tests"
        required: false
        type: boolean
        default: false

jobs:
  run-clojure-dhall-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Official Setup Clojure Action
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@5.0
        with:
          cli: 'latest'

      # Install dhall-to-json binary for Clojure runner
      - name: Install Dhall CLI
        run: |
          curl -sSL https://github.com/dhall-lang/dhall-haskell/releases/download/1.41.2/dhall-json-1.7.11-x86_64-Linux.tar.bz2 | tar -xj
          sudo mv bin/dhall-to-json /usr/local/bin/
          dhall-to-json --version

      # Run Unit Tests (Alexander-Hodge traversal, AVX2 SIMD mocks, and
      # flock-size diagnostics). The :test alias only has :exec-fn (no
      # :main-opts) -- there is no siunertaq/test_runner.clj to -m into
      # -- so this must be invoked with -X, not -M. See deps.edn's
      # :test alias comment.
      - name: Run Clojure unit tests
        if: ${{ inputs.skip_tests != true }}
        working-directory: modules/dhall-bridge
        run: clojure -X:test

      # Execute Batch Runner Application
      - name: Run Clojure batch runner
        working-directory: modules/dhall-bridge
        run: clojure -M:run

  run-clojure-postgres-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@5.0
        with:
          cli: 'latest'

      # Install dhall-to-json binary for postgres_bridge_job_test.clj,
      # which (via DhallBatchRegistry.evalDhall, the same production code
      # PostgresBridgeApp.scala calls) validates PostgresBridgeJob.dhall
      # for real -- same install this job's dhall-bridge counterpart
      # already does, PostgresBridgeJob.dhall just didn't exist until now.
      - name: Install Dhall CLI
        run: |
          curl -sSL https://github.com/dhall-lang/dhall-haskell/releases/download/1.41.2/dhall-json-1.7.11-x86_64-Linux.tar.bz2 | tar -xj
          sudo mv bin/dhall-to-json /usr/local/bin/
          dhall-to-json --version

      # sbt setup + module compile: compilation_wiring_test.clj does real
      # JVM interop into io.siunertaq.postgres.MecrispCompiler (not a
      # transcribed model, unlike mecrisp_instr_test.clj), which needs
      # this module's actual compiled classes -- and everything they
      # depend on (Scala standard library, ASM, cats-effect, etc.) -- on
      # the classpath.
      #
      # History: #1 guessed the path (target/scala-3/classes) -- wrong
      # (the real one turned out to be target/scala-3.8.3/classes, not
      # even close). #2 switched to `sbt export ...fullClasspath` but
      # captured supershell's ANSI status-line escape codes instead of
      # the classpath (a 4-byte file). #3 disabled supershell and
      # merged the two sbt invocations into one session, but the
      # captured file was still empty -- turned out `-Dsbt.supershell
      # =false` doesn't fully silence sbt: the raw dump this produced
      # showed the real classpath printed correctly, immediately
      # followed by one more line containing only a stray ANSI remnant
      # ("[0J"), and `tail -n 1` was reliably grabbing that trailing
      # line instead of the classpath above it. #4 (this version) picks
      # the longest line instead of the last one -- the classpath,
      # being dozens of colon-separated jar paths, is always far longer
      # than any log or escape-remnant line, so this doesn't depend on
      # sbt's exact trailing output shape being guessed correctly
      # either.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile postgres-bridge and export its classpath (Scala)
        run: |
          sbt -Dsbt.supershell=false --error \
            'postgresBridge/compile; export postgresBridge/Compile/fullClasspath' \
            > /tmp/sbt-export-raw.txt 2>&1
          SBT_EXIT=$?

          echo "sbt exit code: ${SBT_EXIT}"
          echo "Raw sbt output (last 40 lines of /tmp/sbt-export-raw.txt):"
          tail -n 40 /tmp/sbt-export-raw.txt

          # Confirmed from an actual raw dump: even with supershell
          # disabled, sbt still emits one stray ANSI-remnant line
          # ("[0J") *after* the classpath line, so `tail -n 1` was
          # reliably grabbing that instead of the classpath. The
          # classpath itself -- every jar on it, colon-separated -- is
          # always dramatically longer than any log or escape-remnant
          # line, so pick the longest line instead of the last one.
          awk '{ if (length($0) > length(longest)) longest = $0 }
               END { print longest }' /tmp/sbt-export-raw.txt \
            | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' \
            > /tmp/postgres-bridge.classpath

          echo "Exported classpath length: $(wc -c < /tmp/postgres-bridge.classpath) bytes"
          echo "First 300 chars:"
          head -c 300 /tmp/postgres-bridge.classpath
          echo

          if [ "${SBT_EXIT}" -ne 0 ] || [ ! -s /tmp/postgres-bridge.classpath ] || \
             ! grep -q "postgres-bridge" /tmp/postgres-bridge.classpath; then
            echo "::error::sbt export did not produce a usable classpath (sbt exit ${SBT_EXIT}) -- see /tmp/sbt-export-raw.txt in the uploaded artifact for the full, unfiltered output"
            exit 1
          fi

      # No Dhall CLI and no -main here: this module is currently
      # test-only. It has no :run alias and defines no entry point to
      # execute. -Scp prepends the sbt-exported classpath above onto
      # whatever :test alone would compute (test.check, test-runner,
      # this module's own test/main/clojure sources) -- so this module's
      # compiled Scala classes are visible to compilation_wiring_test.clj
      # without needing deps.edn to know or guess where sbt put them.
      - name: Run Clojure unit tests
        if: ${{ inputs.skip_tests != true }}
        working-directory: modules/postgres-bridge
        run: |
          BASE_CP=$(clojure -Spath -A:test)
          clojure -Scp "$(cat /tmp/postgres-bridge.classpath):${BASE_CP}" -X:test

      # Upload Clojure crash dumps and runtime classpath on test failure
      - name: Upload Clojure test crash report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: clojure-test-failure-report
          path: |
            /tmp/clojure-*.edn
            /tmp/postgres-bridge.classpath
            /tmp/sbt-export-raw.txt