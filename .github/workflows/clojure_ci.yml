name: Clojure Batch Runner CI

on:
  push:
    branches:
      - "example/feature/clojure_Alexander-Hodge"
    paths:
      - modules/dhall-bridge/**
      - .github/workflows/clojure_ci.yml
  workflow_dispatch: {}

jobs:
  run-clojure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Official Setup Clojure Action
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@5.0
        with:
          cli: 'latest'

      # Install dhall-to-json binary for Clojure runner
      - name: Install Dhall CLI
        run: |
          curl -sSL https://github.com/dhall-lang/dhall-haskell/releases/download/1.41.2/dhall-json-1.7.11-x86_64-Linux.tar.bz2 | tar -xj
          sudo mv bin/dhall-to-json /usr/local/bin/
          dhall-to-json --version

      - name: Run Clojure batch runner
        working-directory: modules/dhall-bridge
        run: clojure -M:run